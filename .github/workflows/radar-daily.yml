name: radar daily (v2 signals + site)

# Daily: collect tier-1 sources into data/radar.sqlite, rebuild docs/radar/, commit.
# No LLM calls — cheap enough to run every day. The Mon/Thu loop (weekly.yml) still
# writes the full build packages; this job only adds momentum, landscape and demand.
on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC = 14:30 Beijing
  workflow_dispatch:

concurrency:
  group: opportunity-loop   # same group as weekly.yml so the two never push at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      PYTHONUNBUFFERED: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        if: env.TINYFISH_API_KEY != ''
        with:
          node-version: '20'

      - name: Install + auth TinyFish (causal trace)
        if: env.TINYFISH_API_KEY != ''
        run: |
          npm install -g tinyfish
          tinyfish auth "$TINYFISH_API_KEY"

      - name: Collect tier-1 sources
        run: python -m radar collect

      - name: Build site (with trace when TinyFish is available)
        run: python -m radar build

      - name: Commit data + site
        run: |
          git config user.name  "opportunity-radar[bot]"
          git config user.email "opportunity-radar[bot]@users.noreply.github.com"
          git add data/snapshots docs/radar
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "radar: $(date -u +%F) daily signals"
          git pull --rebase origin main
          git push origin HEAD:main
