name: radar daily (v3 briefing)

# Daily pipeline: collect → detect → investigate → build docs/v3/ → commit. Storage (v5): DuckDB + Parquet lake in R2.
# Appark gives guests today's charts only, so this must run every day: a missed day is lost history.
# Agent mode (LLM-written briefs) turns on when ANTHROPIC_AUTH_TOKEN is set; TinyFish trace and
# Xiaohongshu (via TinyFish search) turn on when TINYFISH_API_KEY is set. Without keys the briefs are data-only.
on:
  schedule:
    - cron: '30 6 * * *'   # 06:30 UTC = 14:30 Beijing; Appark's same-day charts were updated ~04:56 UTC on 2026-11-18
  workflow_dispatch:

concurrency:
  group: opportunity-loop   # one run at a time, so two runs never push at once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TINYFISH_API_KEY: ${{ secrets.TINYFISH_API_KEY }}
      ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
      PYTHONUNBUFFERED: 1
      # v5 storage: DuckDB working DB in the Actions cache, one Parquet file per table per day in Cloudflare R2.
      # Repo secrets R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET (+ CLOUDFLARE_ACCOUNT_ID, shared with the deploy).
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      RADAR_DUCKDB_MEMORY: 4GB
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r requirements.txt

      # The working DuckDB file lives in the Actions cache (saved under a new key at the end of every run).
      - name: Restore working DB
        id: duck
        uses: actions/cache/restore@v4
        with:
          path: data/radar.duckdb
          key: radar-duck-${{ github.run_id }}
          restore-keys: radar-duck-

      # Cache miss: rebuild from the Parquet lake in R2. The first v5 run instead migrates the v4 SQLite cache
      # (full fidelity), and failing that the v4 snapshots (git + data-charts release). radar picks the source itself.
      - name: Cache miss → download the Parquet lake from R2
        if: steps.duck.outputs.cache-matched-key == ''
        run: |
          if [ -n "$R2_BUCKET" ] && [ -n "$AWS_ACCESS_KEY_ID" ]; then
            aws s3 sync "s3://$R2_BUCKET/lake" data/lake --endpoint-url "$R2_ENDPOINT" --only-show-errors
            find data/lake -name '*.parquet' | wc -l
          else
            echo "::warning::R2 secrets not set: the Parquet lake is not backed up"
          fi

      - name: Cache miss + empty lake → restore the v4 SQLite cache
        if: steps.duck.outputs.cache-matched-key == '' && hashFiles('data/lake/metrics/*.parquet') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            data/radar.sqlite
            data/charts
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-

      - name: Cache miss + no v4 cache → v4 chart snapshots from the data-charts release
        if: steps.duck.outputs.cache-matched-key == '' && hashFiles('data/lake/metrics/*.parquet') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/radar.sqlite ]; then
            mkdir -p data/charts
            gh release download data-charts -p '*.jsonl.gz' -D data/charts --skip-existing || echo "no chart release"
          fi

      - uses: actions/setup-node@v4
        if: env.TINYFISH_API_KEY != ''
        with:
          node-version: '20'

      - name: Install + auth TinyFish (trace + Xiaohongshu)
        if: env.TINYFISH_API_KEY != ''
        run: |
          npm install -g tinyfish
          tinyfish auth "$TINYFISH_API_KEY"

      # Charts first: they are the only sources whose history can't be recovered later.
      - name: Collect charts (Appark, drama, Gravity)
        run: python -m radar collect --only appark,drama,gravity

      - name: Collect measurement (iTunes, Google Play, TrustMRR, Tranco, GitHub)
        run: python -m radar collect --only itunes,gplay,trustmrr,tranco,github

      - name: Collect web stores (Chrome Web Store, Shopify App Store)
        timeout-minutes: 20
        continue-on-error: true
        run: python -m radar collect --only chrome,shopify

      - name: Collect demand (Reddit, Xiaohongshu via TinyFish)
        timeout-minutes: 40
        continue-on-error: true
        run: python -m radar collect --only reddit,xhs_web

      - name: Detect + investigate + build
        run: |
          python -m radar detect
          python -m radar investigate
          python -m radar playbook
          python -m radar categories
          python -m radar build

      # Replaced product rows leave free blocks that DuckDB reuses but never returns: rewrite the file weekly.
      - name: Compact the DB (Sundays)
        if: always()
        run: |
          [ "$(date -u +%u)" = "7" ] && python -m radar compact || true
          ls -la data/radar.duckdb || true

      - name: Save working DB
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/radar.duckdb
          key: radar-duck-${{ github.run_id }}

      # Durable history: every day's Parquet files (and all of them after a migration) go to R2.
      - name: Upload the Parquet lake to R2
        if: always()
        run: |
          [ -d data/lake ] || { echo "nothing exported"; exit 0; }
          if [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::R2 secrets not set: today's Parquet files exist only in this run"; exit 0
          fi
          aws s3 sync data/lake "s3://$R2_BUCKET/lake" --endpoint-url "$R2_ENDPOINT" --only-show-errors
          du -sh data/lake

      - name: Commit data + site
        run: |
          git config user.name  "opportunity-radar[bot]"
          git config user.email "opportunity-radar[bot]@users.noreply.github.com"
          git add docs/v3 docs/start.html
          [ -f data/playbook.json ] && git add data/playbook.json
          [ -f data/categories.json ] && git add data/categories.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "radar v3: $(date -u +%F) daily briefing"
          git pull --rebase origin main
          git push origin HEAD:main
