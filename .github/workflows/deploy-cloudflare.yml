name: deploy to Cloudflare Pages

# Builds docs/ with Jekyll (the v3 site is static HTML; the archive pages and the `/` redirect need Liquid) and
# uploads _site to Cloudflare Pages.
# Triggers: a push to main that touches docs/, and the end of the daily radar workflow. Its commits are pushed
# with GITHUB_TOKEN, which never starts other workflows, so `push` alone would miss every daily update.
# Needs repo secrets CLOUDFLARE_API_TOKEN (permission: Account · Cloudflare Pages · Edit) and CLOUDFLARE_ACCOUNT_ID.
# Optional repo variable CF_PAGES_PROJECT (default: opportunity-loop). The Pages project is created on the first run
# if it doesn't exist (a Worker with the same name is a different thing and doesn't count).
on:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/deploy-cloudflare.yml']
  workflow_run:
    workflows: ['radar daily (v3 briefing)']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true   # only the newest commit matters

permissions:
  contents: read

jobs:
  deploy:
    # after a data workflow, deploy only if it succeeded (a failed run committed nothing new)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT: ${{ vars.CF_PAGES_PROJECT || 'opportunity-loop' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # workflow_run would otherwise check out the commit *before* the data push
          fetch-depth: 1

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Build site with Jekyll
        run: |
          gem install --no-document 'jekyll:~> 4.3' kramdown-parser-gfm
          # baseurl is empty: Cloudflare serves the site at the domain root, not under /opportunity-loop/
          jekyll build --source docs --destination _site --baseurl ''
          test -f _site/index.html && test -f _site/v3/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          W="npx --yes wrangler@3.90.0"
          # first run: create the Pages project (a Worker of the same name doesn't count); errors if it already exists
          $W pages project list | grep -qw "$PROJECT" || $W pages project create "$PROJECT" --production-branch=main
          $W pages deploy _site --project-name="$PROJECT" --branch=main --commit-dirty=true
