title: "Opportunity Loop"
description: "Weekly TrustMRR startup direction radar. 3–5 selectable direction packages every Monday."
theme: minima
markdown: kramdown

sass:
  style: compressed

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: "runs"
    values:
      layout: null
  - scope:
      path: "index.html"
    values:
      layout: home

permalink: /:basename/

exclude:
  - loop/
  - .github/
  - SKILL.md
  - install.sh
  - stage_b.py
  - publish.py
  - requirements.txt
  - _config.yml
  - _layouts/
  - _includes/
  - _sass/
  - assets/
  - README.md
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - vendor/

github:
  owner_name: flyfoxCI
  repository_name: opportunity-loop
