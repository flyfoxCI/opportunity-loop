<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Open Graph -->
  <meta property="og:title" content="{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
<body>
  <a href="#main" class="sr-only">Skip to content</a>

  <main id="main" class="container">
    <header class="hero">
      <a href="{{ '/feed.xml' | relative_url }}" class="hero__rss" title="Subscribe via RSS">🔔 RSS</a>
      <h1 class="hero__title"><a href="{{ '/' | relative_url }}" style="color: var(--ink); border: none;">{{ site.title | split: ' — ' | first }}</a></h1>
      <p class="hero__subtitle">{{ site.description }}</p>
      <div class="hero__meta">
        <span>$10K MRR</span>
        <span>·</span>
        <span>14d MVP</span>
        <span>·</span>
        <span>≤$300/30d marketing</span>
        <span>·</span>
        <span>{{ site.time | date: "%Y" }}</span>
      </div>
    </header>

    {{ content }}

    <footer class="footer">
      <span>{{ site.title }}</span>
      <span>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        ·
        <a href="https://github.com/{{ site.github.owner_name }}/{{ site.github.repository_name }}" target="_blank" rel="noopener">Source</a>
        ·
        <a href="https://trustmrr.com" target="_blank" rel="noopener">TrustMRR</a>
      </span>
    </footer>
  </main>

  <style>
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
  </style>
</body>
</html>
